name: postgres-e2e

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/postgres-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/postgres-e2e.yml"
  schedule:
    - cron: "35 1 * * *"
  workflow_dispatch:

jobs:
  postgres-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: point_ledger
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d point_ledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PostgreSQL E2E suite
        env:
          LEDGER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/point_ledger
        run: |
          RUN_TS="$(date -u +%Y%m%dT%H%M%SZ)"
          RUN_DIR="artifacts/runs/${RUN_TS}"
          mkdir -p "$RUN_DIR"

          pnpm run typecheck > "$RUN_DIR/typecheck.log" 2>&1
          pnpm run test:e2e:postgres -- --retry=2 --reporter=json --outputFile "$RUN_DIR/postgres-e2e-vitest.json" > "$RUN_DIR/postgres-e2e.log" 2>&1

          cat > "$RUN_DIR/postgres-e2e-summary.json" <<JSON
          {
            "runTimestampUtc": "${RUN_TS}",
            "trigger": "${{ github.event_name }}",
            "checks": [
              "pnpm run typecheck",
              "pnpm run test:e2e:postgres"
            ],
            "database": "postgres://postgres@localhost:5432/point_ledger",
            "retryPolicy": {
              "vitestRetry": 2
            },
            "status": "success"
          }
          JSON

          echo "RUN_DIR=${RUN_DIR}" >> "$GITHUB_ENV"

      - name: Generate PostgreSQL E2E trend report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_E2E_WORKFLOW_FILE: postgres-e2e.yml
          POSTGRES_E2E_TREND_WINDOW_DAYS: "14"
          POSTGRES_E2E_TREND_MAX_PAGES: "5"
        run: node scripts/ci/postgres-e2e-trend-report.mjs "$RUN_DIR/postgres-e2e-trend.json"

      - name: Evaluate PostgreSQL E2E trend gate
        env:
          POSTGRES_E2E_GATE_MIN_COMPLETED_RUNS: "5"
          POSTGRES_E2E_GATE_MIN_SUCCESS_RATE: "0.95"
          POSTGRES_E2E_GATE_MAX_RERUN_RATE: "0.20"
          POSTGRES_E2E_GATE_ENFORCE: ${{ github.event_name == 'schedule' }}
        run: node scripts/ci/postgres-e2e-trend-gate.mjs "$RUN_DIR/postgres-e2e-trend.json" "$RUN_DIR/postgres-e2e-gate.json"

      - name: Upload PostgreSQL E2E artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postgres-e2e-${{ github.run_id }}
          path: ${{ env.RUN_DIR }}

      - name: Commit PostgreSQL E2E artifacts
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- artifacts/runs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/runs
            git commit -m "chore: update postgres e2e artifacts [skip ci]"
            git push
          else
            echo "No generated artifact changes to commit"
          fi
