name: ae-framework-evaluation

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "docs/**"
      - "scripts/ae/**"
      - ".github/workflows/ae-framework-evaluation.yml"
  pull_request:
    branches: [main]
    paths:
      - "spec/**"
      - "docs/**"
      - "scripts/ae/**"
      - ".github/workflows/ae-framework-evaluation.yml"
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ae-framework
        uses: actions/checkout@v4
        with:
          repository: itdojp/ae-framework
          ref: main
          path: .tools/ae-framework

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: .tools/ae-framework/pnpm-lock.yaml

      - name: Install ae-framework dependencies
        run: |
          if ! pnpm --dir .tools/ae-framework install --frozen-lockfile; then
            echo "Frozen install failed; retrying with --no-frozen-lockfile"
            pnpm --dir .tools/ae-framework install --no-frozen-lockfile
          fi

      - name: Run evaluation
        run: AE_FRAMEWORK_DIR="$GITHUB_WORKSPACE/.tools/ae-framework" ./scripts/ae/evaluation-run.sh

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ae-framework-evaluation-${{ github.run_id }}
          path: |
            .ae/
            .kiro/
            artifacts/

      - name: Commit generated outputs
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- artifacts/runs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/runs
            git commit -m "chore: update ae-framework evaluation artifacts [skip ci]"
            # Keep only artifacts commits; discard unstaged .ae/.kiro changes before pull --rebase.
            git restore --worktree .ae .kiro
            pushed=0
            for attempt in 1 2 3; do
              if git push; then
                pushed=1
                break
              fi
              git pull --rebase origin "${GITHUB_REF_NAME}"
              ahead="$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD")"
              if [ "$ahead" = "0" ]; then
                pushed=1
                break
              fi
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Failed to push artifacts after retries"
              exit 1
            fi
          else
            echo "No generated changes to commit"
          fi
